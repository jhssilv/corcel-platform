services:
  nginx:
    image: nginx:latest
    container_name: corcel_nginx
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html
    depends_on:
      - frontend
      - backend
    networks:
      - app_network

  frontend:
    build:
      context: .
      dockerfile: .dockerfiles/prod/frontend.Dockerfile
    container_name: corcel_frontend
    ports:
      - "8081:80"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      - backend
    networks:
      - app_network

  backend:
    build:
      context: .
      dockerfile: .dockerfiles/prod/backend.Dockerfile
    container_name: corcel_backend
    ports:
      - "5000:5000"
    environment:
      - LANGUAGETOOL_URL=http://languagetool:8010
    volumes:
      - backend_temp_uploads:/app/api/temp_uploads
      - backend_images:/app/api/images
      - backend_logs:/app/logs
    depends_on:
      - db
      - languagetool
    networks:
      - app_network

  db:
    image: postgres:17
    container_name: corcel_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    env_file:
      - ./api/.env

  languagetool:
    image: erikvl87/languagetool:latest
    container_name: corcel_languagetool
    ports:
      - "8010:8010"
    environment:
      Java_Xms: 512m
      Java_Xmx: 1g
    networks:
      - app_network
    restart: unless-stopped

  backups:
    image: prodrigestivill/postgres-backup-local
    container_name: corcel_backups
    depends_on:
      - db
    volumes:
      - ./backups/dumps:/backups
    networks:
      - app_network
    env_file:
      - ./api/.env
    environment:
      - POSTGRES_HOST=db
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
    restart: unless-stopped

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  ollama_data:
  backend_temp_uploads:
  backend_images:
  backend_logs:
