services:
  frontend:
    build:
      context: .
      dockerfile: .dockerfiles/dev/frontend.Dockerfile
    container_name: corcel_frontend_local
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_PROXY_TARGET=http://backend:5000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - app_network

  backend:
    build:
      context: .
      dockerfile: .dockerfiles/dev/backend.Dockerfile
    container_name: corcel_backend_local
    command: python run_api.py
    working_dir: /app/api
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:1234@db:5432/corcel
      - POSTGRES_USER=postgres
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=corcel
      - FLASK_APP=app/app
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
      - LOG_REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - SECRET_KEY=your_secret_key_here
      - PYTHONUNBUFFERED=1
    volumes:
      - ./api:/app/api
    depends_on:
      - db
      - redis
    networks:
      - app_network

  worker:
    build:
      context: .
      dockerfile: .dockerfiles/dev/backend.Dockerfile
    container_name: corcel_worker_local
    command: celery -A run_worker worker --pool=solo --loglevel=info
    working_dir: /app/api
    environment:
      - DATABASE_URL=postgresql://postgres:1234@db:5432/corcel
      - POSTGRES_USER=postgres
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=corcel
      - FLASK_APP=app/app
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
      - LOG_REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - SECRET_KEY=your_secret_key_here
      - PYTHONUNBUFFERED=1
    volumes:
      - ./api:/app/api
    depends_on:
      - db
      - redis
    networks:
      - app_network

  db:
    image: postgres:17
    container_name: corcel_db_local
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=corcel
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    container_name: corcel_redis_local
    ports:
      - "6379:6379"
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  frontend_node_modules:
  postgres_data_local:
