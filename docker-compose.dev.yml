services:
  frontend:
    build:
      context: .
      dockerfile: .dockerfiles/dev/frontend.Dockerfile
    container_name: corcel_frontend_local
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_PROXY_TARGET=http://backend:5000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - app_network

  backend:
    build:
      context: .
      dockerfile: .dockerfiles/dev/backend.Dockerfile
    container_name: corcel_backend_local
    command: python run_api.py
    working_dir: /app/api
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:1234@db:5432/corcel
      - POSTGRES_USER=postgres
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=corcel
      - FLASK_APP=app/app
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
      - LOG_REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
      - SECRET_KEY=your_secret_key_here
      - PYTHONUNBUFFERED=1
    volumes:
      - ./api:/app/api
    depends_on:
      - db
      - redis
      - ollama
    networks:
      - app_network

  worker:
    build:
      context: .
      dockerfile: .dockerfiles/dev/backend.Dockerfile
    container_name: corcel_worker_local
    command: celery -A run_worker worker --pool=solo --loglevel=info
    working_dir: /app/api
    environment:
      - DATABASE_URL=postgresql://postgres:1234@db:5432/corcel
      - POSTGRES_USER=postgres
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=corcel
      - FLASK_APP=app/app
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
      - LOG_REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
      - SECRET_KEY=your_secret_key_here
      - PYTHONUNBUFFERED=1
    volumes:
      - ./api:/app/api
    depends_on:
      - db
      - redis
      - ollama
    networks:
      - app_network

  db:
    image: postgres:17
    container_name: corcel_db_local
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=corcel
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    container_name: corcel_redis_local
    ports:
      - "6379:6379"
    networks:
      - app_network

  ollama:
    build:
      context: .
      dockerfile: .dockerfiles/prod/ollama.Dockerfile
    container_name: corcel_ollama_local
    ports:
      - "11435:11434"
    volumes:
      - ollama_data_local:/root/.ollama
    networks:
      - app_network
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest
    container_name: corcel_ollama_pull_local
    depends_on:
      - ollama
    volumes:
      - ollama_data_local:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo 'Waiting for Ollama server...'
        until OLLAMA_HOST=http://ollama:11434 ollama list > /dev/null 2>&1; do
          sleep 2
        done
        echo 'Pulling gemma3:4b (this may take a while on first run)...'
        OLLAMA_HOST=http://ollama:11434 ollama pull gemma3:4b
        echo 'Model ready.'
    networks:
      - app_network
    restart: "no"

networks:
  app_network:
    driver: bridge

volumes:
  frontend_node_modules:
  postgres_data_local:
  ollama_data_local:
